version: 1
agent:
  extend: ./agent.yaml
  system_prompt_path: ./web_analyst_system.md
  system_prompt_args:
    ROLE_ADDITIONAL: |
      You are now running as a web analysis subagent. All `user` messages are sent by the main agent. The main agent cannot see your context, it can only see your last message when you finish the task. You must treat the parent agent as your caller.
  when_to_use: |
    Use this agent when you need to analyze a website, reverse-engineer its API, understand its DOM structure, or write automation scripts for it. This agent combines browser inspection with code generation. It can decide whether to use direct API calls (if endpoints are found) or browser automation (if the site is complex/protected).
  allowed_tools:
    - "kimi_cli.tools.browser:BrowserNavigate"
    - "kimi_cli.tools.browser:BrowserClick"
    - "kimi_cli.tools.browser:BrowserType"
    - "kimi_cli.tools.browser:BrowserScroll"
    - "kimi_cli.tools.browser:BrowserScreenshot"
    - "kimi_cli.tools.browser:BrowserExtract"
    - "kimi_cli.tools.browser:BrowserCloseTool"
    - "kimi_cli.tools.browser:BrowserStop"
    - "kimi_cli.tools.browser:BrowserEvaluate"
    - "kimi_cli.tools.browser:BrowserGetHTML"
    - "kimi_cli.tools.browser:BrowserNetworkStart"
    - "kimi_cli.tools.browser:BrowserNetworkList"
    - "kimi_cli.tools.browser:BrowserNetworkStop"
    - "kimi_cli.tools.browser:BrowserGetCookies"
    - "kimi_cli.tools.browser:BrowserSetCookie"
    - "kimi_cli.tools.browser:BrowserGetStorage"
    - "kimi_cli.tools.browser:BrowserWaitForSelector"
    - "kimi_cli.tools.browser:BrowserPressKey"
    - "kimi_cli.tools.browser:BrowserHover"
    - "kimi_cli.tools.browser:BrowserGetTabs"
    - "kimi_cli.tools.browser:BrowserSwitchTab"
    - "kimi_cli.tools.browser:BrowserNewTab"
    - "kimi_cli.tools.shell:Shell"
    - "kimi_cli.tools.file:WriteFile"
    - "kimi_cli.tools.file:ReadFile"
    - "kimi_cli.tools.web:SearchWeb"
    - "kimi_cli.tools.web:FetchURL"
  exclude_tools:
    - "kimi_cli.tools.agent:Agent"
    - "kimi_cli.tools.ask_user:AskUserQuestion"
    - "kimi_cli.tools.todo:SetTodoList"
    - "kimi_cli.tools.plan:ExitPlanMode"
    - "kimi_cli.tools.plan.enter:EnterPlanMode"
    - "kimi_cli.tools.file:StrReplaceFile"
    - "kimi_cli.tools.background:TaskList"
    - "kimi_cli.tools.background:TaskOutput"
    - "kimi_cli.tools.background:TaskStop"
    - "kimi_cli.tools.browser:BrowserUse"
  subagents:
